name: Firebase App Distribution

# Builds the Android APK from develop and sends it to the testers group in
# Firebase App Distribution. Needs two repository secrets:
#   FIREBASE_APP_ID            Android app ID, e.g. 1:1234567890:android:abc123
#   FIREBASE_SERVICE_ACCOUNT   JSON key of a service account with the
#                              "Firebase App Distribution Admin" role
# Optional repository variable FIREBASE_TESTER_GROUPS (default: testers).
# Without the secrets the APK is still built and kept as a workflow artifact.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to testers
        required: false

permissions:
  contents: read

concurrency:
  group: firebase-app-distribution
  cancel-in-progress: true

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE_URL: https://cravewallet-api-av2.onrender.com
      HAS_FIREBASE: ${{ secrets.FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Build Android APK
        run: |
          flutter pub get --enforce-lockfile
          # Same Gradle lock opt-out as android-apk.yml.
          touch android/.ignore-locking.md
          flutter build apk --debug --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-debug.apk CraveWallet-Android.apk
          sha256sum CraveWallet-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CraveWallet-Android-${{ github.run_number }}
          path: |
            CraveWallet-Android.apk
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Write release notes
        if: env.HAS_FIREBASE == 'true'
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          {
            if [ -n "$NOTES" ]; then echo "$NOTES"; else git log -1 --format='%s'; fi
            echo
            echo "Commit ${GITHUB_SHA::7} - API $API_BASE_URL"
          } > release-notes.txt
      - name: Upload to Firebase App Distribution
        if: env.HAS_FIREBASE == 'true'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          npx --yes firebase-tools@13.29.1 appdistribution:distribute CraveWallet-Android.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$GROUPS" \
            --release-notes-file release-notes.txt
          rm -f "$credentials"
      - name: Firebase not configured
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT is missing; the APK was kept as a workflow artifact only."
