name: Flutter CI

on:
  push:
    branches: [develop, main, feature/av2-premium-flutter]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web release for Render
        run: >-
          flutter build web --release --base-href /
          --dart-define=API_BASE_URL=https://cravewallet-api.onrender.com

